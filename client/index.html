<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LiveKit Voice Skeleton</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { padding: 10px 16px; font-size: 15px; margin-right: 8px; cursor: pointer; }
    #status { margin: 16px 0; padding: 10px; background: #f3f3f3; border-radius: 6px; font-family: monospace; white-space: pre-wrap; }
    #vad-indicator { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #ccc; margin-left: 8px; vertical-align: middle; transition: background 0.1s; }
    #vad-indicator.speaking { background: #2ecc71; }
  </style>
</head>
<body>
  <h2>LiveKit Voice Pipeline — Skeleton</h2>
  <p>Joins a LiveKit room, publishes mic audio, plays back remote audio, and shows a basic
     voice-activity indicator (the seed of turn-taking logic).</p>

  <button id="joinBtn">Join Session</button>
  <button id="leaveBtn" disabled>Leave</button>
  <span id="vad-indicator" title="Local mic voice activity"></span>

  <div id="status">Not connected.</div>
  <div id="remote-audio-container"></div>

  <script type="module" src="./client.js"></script>
</body>
</html>
